<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل ترتيب العروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-2: #111827;
      --card: #151c2b;
      --card-2: #1b2436;
      --border: #263048;
      --text: #e6e9f2;
      --muted: #8b95ab;
      --primary: #7c5cff;
      --primary-2: #a78bfa;
      --ok: #34d399;
      --err: #f87171;
      --warn: #fbbf24;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", system-ui, Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(700px 400px at -10% 110%, rgba(52,211,153,.08), transparent 60%),
        var(--bg);
      min-height: 100vh;
      padding: 40px 16px 60px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }

    header { margin-bottom: 28px; }
    header h1 { margin: 0 0 6px; font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
    header p { margin: 0; color: var(--muted); }

    /* اختيار العرض */
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .tab {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 500;
      display: flex; align-items: center; gap: 8px; transition: .15s;
    }
    .tab:hover { border-color: var(--primary); }
    .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .tab .count {
      font-size: .78rem; background: rgba(255,255,255,.12); padding: 2px 8px; border-radius: 999px;
    }
    .tab.closed { opacity: .65; }

    .layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: linear-gradient(180deg, var(--card), var(--bg-2));
      border: 1px solid var(--border); border-radius: var(--radius); padding: 22px;
    }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .card .sub { margin: 0 0 20px; color: var(--muted); font-size: .92rem; }

    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: .95rem; }
    input[type=text] {
      width: 100%; padding: 13px 14px; font: inherit; color: var(--text);
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 20px; transition: .15s;
    }
    input[type=text]::placeholder { color: #5d6780; }
    input[type=text]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }

    .legend { display: flex; gap: 16px; font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
    .legend span::before {
      content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
      margin-left: 6px; vertical-align: middle;
    }
    .legend .l-free::before { background: var(--card-2); border: 1px solid var(--border); }
    .legend .l-sel::before { background: var(--primary); }
    .legend .l-taken::before { background: #2a2f3d; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; margin-bottom: 22px; }
    .slot {
      aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px;
      background: var(--card-2); border: 1px solid var(--border); font-weight: 600;
      cursor: pointer; transition: .12s; user-select: none;
    }
    .slot:hover { border-color: var(--primary-2); transform: translateY(-1px); }
    .slot.selected { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 18px rgba(124,92,255,.35); }
    .slot.taken { background: #1a1e29; color: #4b5368; cursor: not-allowed; text-decoration: line-through; border-color: transparent; }
    .slot.taken:hover { transform: none; }
    .slot.mine { background: rgba(52,211,153,.15); color: var(--ok); border-color: var(--ok); text-decoration: none; }

    button.primary {
      width: 100%; padding: 14px; font: inherit; font-weight: 700; font-size: 1rem;
      border: 0; border-radius: 10px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #5b3df5);
      transition: .15s;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.1); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }

    .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; display: none; font-size: .95rem; }
    .msg.ok { display: block; background: rgba(52,211,153,.12); color: var(--ok); border: 1px solid rgba(52,211,153,.3); }
    .msg.err { display: block; background: rgba(248,113,113,.1); color: var(--err); border: 1px solid rgba(248,113,113,.3); }
    .msg.info { display: block; background: rgba(251,191,36,.08); color: var(--warn); border: 1px solid rgba(251,191,36,.25); }

    /* القائمة */
    .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .progress { font-size: .85rem; color: var(--muted); }
    .bar { height: 6px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--ok)); width: 0; transition: width .4s; }
    ul.students { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow-y: auto; }
    ul.students li {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
    }
    ul.students li.empty { opacity: .45; border-style: dashed; background: transparent; }
    ul.students li.me { border-color: var(--ok); background: rgba(52,211,153,.08); }
    .num {
      min-width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px;
      background: rgba(124,92,255,.15); color: var(--primary-2); font-weight: 700; font-size: .95rem;
    }
    li.empty .num { background: transparent; color: var(--muted); }
    li.me .num { background: rgba(52,211,153,.18); color: var(--ok); }
    .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { font-size: .75rem; color: var(--ok); }

    .refresh {
      background: none; border: 1px solid var(--border); color: var(--muted); font: inherit;
      font-size: .82rem; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    }
    .refresh:hover { color: var(--text); border-color: var(--primary); }

    .empty-state { text-align: center; color: var(--muted); padding: 50px 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>تسجيل ترتيب العروض</h1>
      <p>اختر العرض، اكتب اسمك، ثم اختر رقمًا متاحًا.</p>
    </header>

    <div class="tabs" id="tabs"></div>

    <div id="noPres" class="card empty-state hidden">لا توجد عروض متاحة حاليًا.</div>

    <div class="layout" id="main">
      <section class="card">
        <h2 id="presTitle">—</h2>
        <p class="sub" id="presSub"></p>

        <form id="form">
          <label for="name">اسم الطالب</label>
          <input type="text" id="name" required maxlength="80" placeholder="الاسم الكامل" autocomplete="name">

          <label>رقم الترتيب</label>
          <div class="legend">
            <span class="l-free">متاح</span>
            <span class="l-sel">اختيارك</span>
            <span class="l-taken">محجوز</span>
          </div>
          <div class="grid" id="grid"></div>

          <button type="submit" class="primary" id="btn">تسجيل</button>
        </form>

        <div class="msg" id="msg"></div>
      </section>

      <section class="card">
        <div class="list-head">
          <h2>ترتيب العرض</h2>
          <button class="refresh" id="refresh" type="button">تحديث ↻</button>
        </div>
        <div class="progress" id="progress"></div>
        <div class="bar"><div id="barFill"></div></div>
        <ul class="students" id="list"></ul>
      </section>
    </div>
  </div>

  <script>
    // ===== الإعدادات: غيّرها ببيانات مشروعك في Supabase =====
    const SUPABASE_URL = "https://zrrrtcjcwbhzlxwmpwiq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Qm50drcQBVJraFsW36beig_1LKNuV6j";
    const AUTO_REFRESH_SECONDS = 20;
    // ========================================================

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);

    // معرّف ثابت لهذا الجهاز/المتصفح
    function getDeviceId() {
      let id = null;
      try { id = localStorage.getItem("device_id"); } catch {}
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID()
              : Date.now().toString(36) + Math.random().toString(36).slice(2));
        try { localStorage.setItem("device_id", id); } catch {}
      }
      return id;
    }
    const DEVICE_ID = getDeviceId();

    // تسجيلات هذا الجهاز محفوظة محليًا لعرض "أنت" في القائمة
    function getMine() {
      try { return JSON.parse(localStorage.getItem("my_regs") || "{}"); } catch { return {}; }
    }
    function saveMine(presId, num) {
      const m = getMine(); m[presId] = num;
      try { localStorage.setItem("my_regs", JSON.stringify(m)); } catch {}
    }

    let presentations = [];
    let current = null;      // العرض المختار
    let selected = null;     // الرقم المختار
    let counts = {};

    function showMsg(text, type) { $("msg").textContent = text; $("msg").className = "msg " + type; }
    function clearMsg() { $("msg").className = "msg"; }

    async function loadPresentations() {
      const { data, error } = await db
        .from("presentations")
        .select("id, title, max_slots, is_open")
        .order("created_at", { ascending: true });
      if (error) { showMsg("تعذّر تحميل العروض: " + error.message, "err"); return; }
      presentations = data;

      // عدد المسجلين في كل عرض
      const { data: regs } = await db.from("registrations").select("presentation_id");
      counts = {};
      (regs || []).forEach(r => counts[r.presentation_id] = (counts[r.presentation_id] || 0) + 1);

      if (!presentations.length) {
        $("main").classList.add("hidden"); $("noPres").classList.remove("hidden"); $("tabs").innerHTML = "";
        return;
      }
      $("main").classList.remove("hidden"); $("noPres").classList.add("hidden");

      // اختيار العرض من الرابط ?p=ID أو الأول
      if (!current) {
        const fromUrl = Number(new URLSearchParams(location.search).get("p"));
        current = presentations.find(p => p.id === fromUrl) || presentations.find(p => p.is_open) || presentations[0];
      } else {
        current = presentations.find(p => p.id === current.id) || presentations[0];
      }
      renderTabs();
    }

    function renderTabs() {
      const tabs = $("tabs"); tabs.innerHTML = "";
      presentations.forEach(p => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tab" + (p.id === current.id ? " active" : "") + (p.is_open ? "" : " closed");
        const t = document.createElement("span"); t.textContent = p.title;
        const c = document.createElement("span"); c.className = "count";
        c.textContent = (counts[p.id] || 0) + "/" + p.max_slots;
        b.append(t, c);
        b.onclick = () => {
          current = p; selected = null; clearMsg();
          history.replaceState(null, "", "?p=" + p.id);
          renderTabs(); loadRegistrations();
        };
        tabs.appendChild(b);
      });
    }

    async function loadRegistrations() {
      if (!current) return;
      const { data, error } = await db
        .from("registrations")
        .select("student_name, order_number")
        .eq("presentation_id", current.id)
        .order("order_number", { ascending: true });
      if (error) { showMsg("تعذّر تحميل التسجيلات: " + error.message, "err"); return; }

      const taken = new Map(data.map(r => [r.order_number, r.student_name]));
      const myNum = getMine()[current.id];
      const alreadyMine = myNum && taken.has(myNum);
      if (taken.has(selected)) selected = null;

      $("presTitle").textContent = current.title;
      $("presSub").textContent = current.is_open
        ? `${data.length} من ${current.max_slots} مسجّلين`
        : "التسجيل في هذا العرض مغلق";

      // شبكة الأرقام
      const grid = $("grid"); grid.innerHTML = "";
      const locked = !current.is_open || alreadyMine;
      for (let i = 1; i <= current.max_slots; i++) {
        const s = document.createElement("div");
        s.textContent = i;
        let cls = "slot";
        if (alreadyMine && i === myNum) cls += " mine";
        else if (taken.has(i)) cls += " taken";
        else if (i === selected) cls += " selected";
        s.className = cls;
        if (taken.has(i)) s.title = taken.get(i);
        if (!taken.has(i) && !locked) s.onclick = () => { selected = i; loadRegistrations(); };
        grid.appendChild(s);
      }

      // حالة النموذج
      $("btn").disabled = locked;
      $("name").disabled = locked;
      if (alreadyMine) showMsg(`سجّلت من هذا الجهاز برقم ${myNum} في هذا العرض.`, "info");
      else if (!current.is_open) showMsg("التسجيل مغلق لهذا العرض.", "info");
      else if ($("msg").classList.contains("info")) clearMsg();

      // القائمة مرتبة من الأول للأخير
      const list = $("list"); list.innerHTML = "";
      for (let i = 1; i <= current.max_slots; i++) {
        const li = document.createElement("li");
        const n = document.createElement("span"); n.className = "num"; n.textContent = i;
        const nm = document.createElement("span"); nm.className = "sname";
        if (taken.has(i)) {
          nm.textContent = taken.get(i);   // textContent يمنع حقن HTML
          if (alreadyMine && i === myNum) {
            li.className = "me";
            const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = "أنت";
            li.append(n, nm, tg); list.appendChild(li); continue;
          }
        } else {
          li.className = "empty"; nm.textContent = "متاح";
        }
        li.append(n, nm); list.appendChild(li);
      }

      $("progress").textContent = `${data.length} / ${current.max_slots}`;
      $("barFill").style.width = (data.length / current.max_slots * 100) + "%";
    }

    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("name").value.trim().replace(/\s+/g, " ");
      if (!name) return showMsg("اكتب اسمك.", "err");
      if (!selected) return showMsg("اختر رقم ترتيب.", "err");

      $("btn").disabled = true;
      const { error } = await db.from("registrations").insert({
        presentation_id: current.id,
        student_name: name,
        order_number: selected,
        device_id: DEVICE_ID
      });

      if (error) {
        $("btn").disabled = false;
        const m = error.message || "";
        if (error.code === "23505") {
          if (m.includes("uniq_device")) showMsg("هذا الجهاز سجّل مسبقًا في هذا العرض.", "err");
          else if (m.includes("uniq_name")) showMsg("هذا الاسم مسجّل مسبقًا في هذا العرض.", "err");
          else showMsg(`الرقم ${selected} انحجز للتو، اختر رقمًا آخر.`, "err");
        } else if (error.code === "42501") {
          showMsg("لا يمكن التسجيل: العرض مغلق أو الرقم خارج النطاق.", "err");
        } else {
          showMsg("حدث خطأ: " + m, "err");
        }
      } else {
        saveMine(current.id, selected);
        $("form").reset();
        showMsg(`تم تسجيل ${name} برقم ${selected} ✔`, "ok");
        selected = null;
        counts[current.id] = (counts[current.id] || 0) + 1;
        renderTabs();
      }
      await loadRegistrations();
      if (!error) showMsg(`تم التسجيل بنجاح ✔`, "ok");
    });

    $("refresh").onclick = async () => { await loadPresentations(); loadRegistrations(); };

    (async () => {
      await loadPresentations();
      await loadRegistrations();
      setInterval(async () => {
        if (document.hidden) return;
        await loadPresentations(); loadRegistrations();
      }, AUTO_REFRESH_SECONDS * 1000);
    })();
  </script>
</body>
</html>
