<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f17">
  <title>تسجيل ترتيب العروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/student.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>تسجيل ترتيب العروض</h1>
      <p>اكتب اسمك، ثم اختر رقمًا متاحًا.</p>
    </header>

    <div id="noPres" class="card empty-state hidden">الرابط غير صحيح أو العرض غير موجود. تأكد من الرابط المرسل لك.</div>

    <div class="layout hidden" id="main">
      <section class="card">
        <h2 id="presTitle">—</h2>
        <p class="sub" id="presSub"></p>

        <form id="form">
          <label for="name">اسم الطالب</label>
          <input type="text" id="name" required maxlength="80" placeholder="الاسم الكامل" autocomplete="name">

          <label>رقم الترتيب</label>
          <p class="turn-note hidden" id="turnNote"></p>
          <div class="legend">
            <span class="l-free">متاح</span>
            <span class="l-sel">اختيارك</span>
            <span class="l-taken">محجوز</span>
            <span class="l-passed">فات</span>
          </div>
          <div class="grid" id="grid"></div>

          <button type="submit" class="primary" id="btn">تسجيل</button>
        </form>

        <div class="msg" id="msg"></div>
      </section>

      <section class="card">
        <div class="list-head">
          <h2>ترتيب العرض</h2>
          <div class="list-actions">
            <button class="ghost" id="toggleEmpty" type="button">إخفاء المتاح</button>
            <button class="ghost" id="refresh" type="button">تحديث ↻</button>
          </div>
        </div>
        <div class="progress" id="progress"></div>
        <div class="bar"><div id="barFill"></div></div>
        <ul class="students" id="list"></ul>
      </section>
    </div>

    <footer>
      تطوير ياسر الغامدي ·
      <a href="https://ysg.sa" target="_blank" rel="noopener">ysg.sa</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
